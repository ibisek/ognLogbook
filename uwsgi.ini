[uwsgi]
# Application setup
chdir = /var/www/ognLogbook
module = index:app
virtualenv = /var/www/ognLogbook/venv
pythonpath = /var/www/ognLogbook/src

# Process & Thread Management
master = true
processes = 4
threads = 2
enable-threads = true
single-interpreter = true

# Socket Configuration
socket = /run/ognLogbook/uwsgi.sock
chmod-socket = 660
vacuum = true

# Lifecycle & Signal Management
die-on-term = true

# Resource & Memory Limits
max-requests = 5000
max-worker-lifetime = 3600
reload-on-rss = 512
